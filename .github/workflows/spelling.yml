name: Spell Check

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Least-privilege default: no job in this workflow writes to the repo.
permissions:
  contents: read

jobs:
  run:
    name: Spell Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      
    - name: MFC Python Setup
      run:  ./mfc.sh init
      
    - name: Spell Check
      run:  ./mfc.sh spelling
