name: Lines of Code

# pull_request_target so that the comment can be posted on pull requests from
# forks, whose GITHUB_TOKEN is read-only under the pull_request event. The PR's
# code is checked out as data and read by the base branch's counter; it is never
# executed, and no credentials are persisted alongside it.
on:
  pull_request_target:
    paths:
      - 'src/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  sz:
    name: Core MFC Line Difference
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the base branch
        uses: actions/checkout@v5
        with:
          path: base
          fetch-depth: 0

      - name: Checkout the PR branch
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false

      # Counting against the merge base rather than the tip of the base branch
      # means a PR is only ever charged for the lines it actually adds, however
      # far behind the branch has fallen.
      - name: Get Line Diff
        working-directory: base
        run: |
          git fetch --no-tags origin "+refs/pull/${{ github.event.number }}/head:refs/mfc/pr"
          git worktree add ../mb "$(git merge-base HEAD refs/mfc/pr)"
          ./mfc.sh count_diff ../mb ../pr --markdown "$GITHUB_WORKSPACE/loc.md"

      - name: Comment Line Diff
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ignore_empty: true
          skip_unchanged: true
          recreate: true
          path: loc.md
