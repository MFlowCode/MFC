name: Pretty

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Least-privilege default: no job in this workflow writes to the repo.
permissions:
  contents: read

jobs:
  docs:
    name:    Formatting
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: MFC Python setup
      run: ./mfc.sh init

    - name: Check formatting
      run: |
        ./mfc.sh format -j $(nproc)
        git diff --exit-code
