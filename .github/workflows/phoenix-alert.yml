name: 'Cluster Master Alert'

# Keep one issue open per cluster while it fails in the scheduled master run of the Test
# Suite, listing the merges since the last green run.
on:
  workflow_run:
    workflows: ['Test Suite']
    types: [completed]
    branches: [master]

concurrency:
  group: cluster-alert
  cancel-in-progress: false

permissions:
  contents: read
  # write: dispatches the Cluster Bisect workflow.
  actions: write
  issues: write

jobs:
  alert:
    if: github.repository == 'MFlowCode/MFC' && github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cluster: [Phoenix, Frontier]
    steps:
      - name: Clone
        uses: actions/checkout@v5

      - name: Open, update, or close the issue
        env:
          GH_TOKEN:    ${{ github.token }}
          REPO:        ${{ github.repository }}
          RUN_ID:      ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          HEAD_SHA:    ${{ github.event.workflow_run.head_sha }}
          CLUSTER:     ${{ matrix.cluster }}
        run: bash .github/scripts/phoenix-master-alert.sh
