name: Toolchain Compatibility

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Least-privilege default: no job in this workflow writes to the repo.
permissions:
  contents: read

jobs:
  test-toolchain:
    name: "Python ${{ matrix.python-version }}"
    runs-on: ${{ matrix.python-version == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # The ends of the range mfc.sh accepts (toolchain/bootstrap/python.sh): in the last 40 failed
        # runs, a version in between never failed without 3.9 or 3.14 failing too.
        python-version: ['3.9', '3.14']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Initialize MFC
        run: ./mfc.sh init
      - name: Lint and test toolchain
        run: ./mfc.sh lint
