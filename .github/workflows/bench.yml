name: 'Benchmark'

# Benchmarks run with the full cluster pass (cluster-mode in test.yml): a ready PR labelled
# ci:clusters or touching cluster-critical paths, a manual run, and the 6-hourly schedule when
# master has a commit not yet benchmarked. A scheduled run compares master with the commit the previous one benchmarked.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  schedule:
    - cron: '47 */6 * * *'
  workflow_dispatch:

concurrency:
  # A run started by a label does nothing unless the label is ci:clusters and the commit has no
  # benchmark yet (cluster-mode.sh); its own group, so it does not cancel a benchmark in progress.
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event.action == 'labeled' && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege default: no job in this workflow writes to the repo.
permissions:
  contents: read

jobs:
  file-changes:
    name: Detect File Changes
    if: github.event.action != 'labeled' || github.event.label.name == 'ci:clusters'
    # Job-level permissions replace the workflow default outright rather than
    # merging with it, so contents must be restated here.
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
    runs-on: 'ubuntu-latest'
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      base: ${{ steps.mode.outputs.base }}
    steps:
      - name: Clone
        uses: actions/checkout@v5

      - name: Detect Changes
        if:   github.event_name != 'schedule'
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: ".github/file-filter.yml"

      - name: Decide
        id: mode
        env:
          GH_TOKEN:  ${{ github.token }}
          EVENT:     ${{ github.event_name }}
          REPO:      ${{ github.repository }}
          RUN_ID:    ${{ github.run_id }}
          HEAD_SHA:  ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_DRAFT:  ${{ github.event.pull_request.draft }}
          CHECKALL:  ${{ steps.changes.outputs.checkall }}
          WORKFLOW:  bench.yml
          PARTIAL:   1
          ACTION:      ${{ github.event.action }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/cluster-mode.sh

  self:
    # Prefixed so it cannot be confused with the Test Suite job of the same
    # cluster and device: the two produced identical check names, and a
    # benchmark failure repeatedly read as a test-suite regression.
    name: "Bench | ${{ matrix.name }} (${{ matrix.device }}${{ matrix.interface != 'none' && format('-{0}', matrix.interface) || '' }})"
    if: github.repository == 'MFlowCode/MFC' && needs.file-changes.outputs.mode == 'full'
    needs: file-changes
    strategy:
      fail-fast: false
      matrix:
        include:
          - cluster: phoenix
            name: Georgia Tech | Phoenix (NVHPC)
            group: phoenix
            labels: gt
            flag: p
            device: gpu
            interface: acc
            build_script: ""
          - cluster: phoenix
            name: Georgia Tech | Phoenix (NVHPC)
            group: phoenix
            labels: gt
            flag: p
            device: gpu
            interface: omp
            build_script: ""
          - cluster: frontier
            name: Oak Ridge | Frontier (CCE)
            group: phoenix
            labels: frontier
            flag: f
            device: gpu
            interface: acc
            build_script: "bash .github/workflows/frontier/build.sh gpu acc"
          - cluster: frontier
            name: Oak Ridge | Frontier (CCE)
            group: phoenix
            labels: frontier
            flag: f
            device: gpu
            interface: omp
            build_script: "bash .github/workflows/frontier/build.sh gpu omp"
          - cluster: frontier_amd
            name: Oak Ridge | Frontier (AMD)
            group: phoenix
            labels: frontier
            flag: famd
            device: gpu
            interface: omp
            build_script: "bash .github/workflows/frontier_amd/build.sh gpu omp"
    continue-on-error: ${{ matrix.cluster == 'frontier' || matrix.cluster == 'frontier_amd' }}
    runs-on:
      group: ${{ matrix.group }}
      labels: ${{ matrix.labels }}
    # Queue wait (capped by SLURM_MAX_QUEUE_SECONDS) plus the SLURM time limit.
    timeout-minutes: 480
    steps:
      # The checkouts keep their files between runs (clean: false, for the .slurm_job_id files): an
      # earlier run's logs and results there would pass for this run's.
      - name: Clean stale output files
        run: rm -f ./*.out {pr,master}/bench*.out {pr,master}/bench*.yaml {pr,master}/bench*.gpu

      - name: Clone - PR
        uses: actions/checkout@v5
        with:
          path: pr
          clean: false

      - name: Clone - Master
        uses: actions/checkout@v5
        with:
          repository: MFlowCode/MFC
          ref: ${{ needs.file-changes.outputs.base || 'master' }}
          path: master
          clean: false

      - name: Fetch Dependencies
        if: matrix.build_script != ''
        timeout-minutes: 150
        run: |
          (cd pr     && ${{ matrix.build_script }}) &
          pid1=$!
          (cd master && ${{ matrix.build_script }}) &
          pid2=$!
          e1=0; e2=0
          wait $pid1 || e1=$?
          wait $pid2 || e2=$?
          if [ $e1 -ne 0 ] || [ $e2 -ne 0 ]; then
            echo "Build failures: pr=$e1 master=$e2"
            exit 1
          fi

      - name: Bench (Master v. PR)
        run: bash pr/.github/scripts/run_parallel_benchmarks.sh ${{ matrix.device }} ${{ matrix.interface }} ${{ matrix.cluster }}

      - name: Cancel SLURM Jobs
        if: cancelled()
        run: |
          find . -name "*.slurm_job_id" | while read -r f; do
            job_id=$(cat "$f")
            echo "Cancelling SLURM job $job_id"
            scancel "$job_id" 2>/dev/null || true
          done

      - name: Generate & Post Comment
        if: always()
        env:
          # Names the matrix leg in the run-summary table; every leg writes its own.
          MFC_BENCH_SUMMARY_LABEL: ${{ matrix.cluster }} ${{ matrix.device }} ${{ matrix.interface }}
        run: |
          (cd pr && . ./mfc.sh load -c ${{ matrix.flag }} -m g)
          (cd pr && ./mfc.sh bench_diff ../master/bench-${{ matrix.device }}-${{ matrix.interface }}.yaml ../pr/bench-${{ matrix.device }}-${{ matrix.interface }}.yaml)

      - name: Print Logs
        if:   always()
        run: |
          # bench*- also catches the single-node bench-pair-<d>-<i>.out job log.
          cat pr/bench*-${{ matrix.device }}-${{ matrix.interface }}.* 2>/dev/null || true
          cat master/bench*-${{ matrix.device }}-${{ matrix.interface }}.* 2>/dev/null || true

      - name: Print Per-Case Logs
        if: always()
        run: |
          passed=() failed=()
          for out in pr/build/benchmarks/*/*.out master/build/benchmarks/*/*.out; do
            [ -f "$out" ] || continue
            [ -f "${out%.out}.yaml" ] && passed+=("$out") || failed+=("$out")
          done

          echo "=== Per-Case Summary: ${#failed[@]} failed, ${#passed[@]} passed ==="
          for out in "${failed[@]}"; do echo "  [FAILED] $out"; done
          for out in "${passed[@]}"; do echo "  [PASSED] $out"; done

          if [ ${#failed[@]} -gt 0 ]; then
            echo ""
            echo "=== Failed Case Logs ==="
            for out in "${failed[@]}"; do
              echo "--- $out ---"
              cat "$out"
              echo ""
            done
          fi

      # The scheduled run's numbers for master feed the benchmark history (job `record`).
      # Phoenix's GPU partitions differ several-fold, so its numbers are recorded per GPU model.
      - name: Note GPU model
        if: github.event_name == 'schedule' && matrix.cluster == 'phoenix'
        run: |
          # This run's single-node job log only.
          grep -ohm1 'gres/gpu:[a-z0-9]*' pr/bench-pair-${{ matrix.device }}-${{ matrix.interface }}.out | cut -d: -f2 > pr/bench-${{ matrix.device }}-${{ matrix.interface }}.gpu || true

      - name: Archive Result
        if: github.event_name == 'schedule'
        uses: actions/upload-artifact@v6
        with:
          name: bench-result-${{ matrix.cluster }}-${{ matrix.device }}-${{ matrix.interface }}
          path: |
            pr/bench-${{ matrix.device }}-${{ matrix.interface }}.yaml
            pr/bench-${{ matrix.device }}-${{ matrix.interface }}.gpu
          if-no-files-found: ignore
          retention-days: 7

      # A pull request's numbers and master's, for the comment bench-comment.yml posts.
      - name: Archive Comparison
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: bench-compare-${{ matrix.cluster }}-${{ matrix.device }}-${{ matrix.interface }}
          path: |
            pr/bench-${{ matrix.device }}-${{ matrix.interface }}.yaml
            master/bench-${{ matrix.device }}-${{ matrix.interface }}.yaml
          if-no-files-found: ignore
          retention-days: 7

      # All other runners (non-Phoenix) just run without special env
      - name: Archive Logs (Frontier)
        if: always() && matrix.cluster != 'phoenix'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.cluster }}-${{ matrix.device }}-${{ matrix.interface }}
          path: |
            pr/bench-${{ matrix.device }}-${{ matrix.interface }}.*
            pr/build/benchmarks/*
            master/bench-${{ matrix.device }}-${{ matrix.interface }}.*
            master/build/benchmarks/*

  record:
    # Appends each lane's result for this master commit to benchmarks.jsonl in MFlowCode/MFC-ci-data,
    # which docs/dashboard/benchmarks.html reads. CI_DATA_DEPLOY_KEY is a deploy key with write access there.
    name: Record Benchmark History
    if: always() && github.repository == 'MFlowCode/MFC' && github.event_name == 'schedule' && needs.file-changes.outputs.mode == 'full'
    needs: [file-changes, self]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write: opens an issue when the history cannot be recorded.
      issues: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          pattern: bench-result-*
          path: results

      - name: Append to history
        id: record
        env:
          DEPLOY_KEY: ${{ secrets.CI_DATA_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ needs.file-changes.outputs.base }}
        run: |
          pip3 install --quiet PyYAML
          date=$(git show -s --format=%cI "$GITHUB_SHA")
          subject=$(git show -s --format=%s "$GITHUB_SHA")
          # Every commit since the previously benchmarked one: any of them can be behind a change.
          echo '{}' > compare.json
          if [ -n "$BASE" ] && [ "$BASE" != "$GITHUB_SHA" ]; then
            gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$GITHUB_SHA" > compare.json || echo '{}' > compare.json
          fi
          : > new.jsonl
          for dir in results/bench-result-*; do
            [ -d "$dir" ] || continue
            IFS=- read -r cluster device interface <<<"${dir#results/bench-result-}"
            python3 .github/scripts/bench-record.py "$dir/bench-$device-$interface.yaml" \
              "$cluster" "$device" "$interface" "$GITHUB_SHA" "$date" "$subject" \
              "$(head -n1 "$dir/bench-$device-$interface.gpu" 2>/dev/null)" compare.json >> new.jsonl || true
          done
          if [ ! -s new.jsonl ]; then echo "No benchmark results to record."; exit 0; fi

          .github/scripts/ci-data-append.sh benchmarks.jsonl new.jsonl "Benchmarks @ ${GITHUB_SHA::7}"
          echo "recorded=true" >> "$GITHUB_OUTPUT"

      - name: Say so when the history cannot be recorded
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO:     ${{ github.repository }}
        run: |
          bash .github/scripts/ci-issue.sh open "Benchmark history is not being recorded" "The benchmark recorder failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. The performance page stops updating until it is fixed. A missing or revoked \`CI_DATA_DEPLOY_KEY\` is the usual cause."

      - name: Clear that once it records again
        # Not when there was nothing to record: that says nothing about whether recording works.
        if: success() && steps.record.outputs.recorded == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO:     ${{ github.repository }}
        run: |
          bash .github/scripts/ci-issue.sh close "Benchmark history is not being recorded" "Recording again: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
