name: Claude Code Review

on:
  pull_request_target:
    types: [opened, ready_for_review, reopened, labeled]
  issue_comment:
    types: [created]

jobs:
  claude-review:
    if: >
      (
        github.event_name == 'pull_request_target' &&
        (
          github.event.action == 'opened' ||
          github.event.action == 'ready_for_review' ||
          github.event.action == 'reopened' ||
          (
            github.event.action == 'labeled' &&
            github.event.label.name == 'claude-full-review'
          )
        )
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '@claude full review')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read

    steps:
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip jq

      - name: Determine PR number
        id: mode
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request_target" ]]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
          elif [[ "${{ github.event_name }}" == "issue_comment" ]]; then
            PR_NUMBER="${{ github.event.issue.number }}"
          else
            echo "Unsupported event"
            exit 1
          fi

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      # Base repo only. This job is privileged (pull_request_target / issue_comment:
      # it holds secrets and a write-capable token), so the PR head is never checked
      # out or fetched here. The diff and per-file context are pulled through the gh
      # API in later steps and treated purely as data.
      - name: Checkout base repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve review state
        id: state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          PR_NUMBER="${{ steps.mode.outputs.pr_number }}"
          REPO="${{ github.repository }}"

          mkdir -p .claude-review/context

          CURRENT_HEAD_SHA="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq .headRefOid)"
          echo "current_head_sha=$CURRENT_HEAD_SHA" >> "$GITHUB_OUTPUT"

          LAST_COMMENT_B64="$(
            gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" \
              --jq '.[] | select(.body | contains("<!-- claude-review: thread=primary;")) | @base64' \
              | tail -n1 || true
          )"

          EXISTING_COMMENT_ID=""

          if [[ -n "${LAST_COMMENT_B64:-}" ]]; then
            LAST_COMMENT_JSON="$(printf '%s' "$LAST_COMMENT_B64" | base64 -d)"
            EXISTING_COMMENT_ID="$(printf '%s' "$LAST_COMMENT_JSON" | jq -r '.id // empty')"
          fi

          echo "existing_comment_id=${EXISTING_COMMENT_ID:-}" >> "$GITHUB_OUTPUT"

      - name: Build review diff and changed-file list
        id: review_input
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          PR_NUMBER="${{ steps.mode.outputs.pr_number }}"
          REPO="${{ github.repository }}"

          mkdir -p .claude-review

          gh pr diff "$PR_NUMBER" --repo "$REPO" > .claude-review/review.diff.raw
          gh pr view "$PR_NUMBER" --repo "$REPO" --json files --jq '.files[].path' > .claude-review/changed_files.txt.raw

          # Filter out tests/ directory — golden files don't need code review
          grep -v '^tests/' .claude-review/changed_files.txt.raw > .claude-review/changed_files.txt || true
          # Strip diff hunks for tests/ files
          awk '
            /^diff --git a\/tests\// { skip=1; next }
            /^diff --git /           { skip=0 }
            !skip                    { print }
          ' .claude-review/review.diff.raw > .claude-review/review.diff

          sed -i '/^[[:space:]]*$/d' .claude-review/changed_files.txt || true

          echo "review_diff_path=.claude-review/review.diff" >> "$GITHUB_OUTPUT"
          echo "changed_files_path=.claude-review/changed_files.txt" >> "$GITHUB_OUTPUT"

      - name: Prefetch bounded context for changed files only
        id: context
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          REPO="${{ github.repository }}"
          HEAD_SHA="${{ steps.state.outputs.current_head_sha }}"
          COUNT=0

          mkdir -p .claude-review/context

          # Prioritize src/ files for context (most likely to need review)
          sort -t/ -k1,1 -s < "${{ steps.review_input.outputs.changed_files_path }}" | \
            awk '/^src\//{print; next} {rest[NR]=$0} END{for(i in rest) print rest[i]}' > .claude-review/sorted_files.txt

          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            COUNT=$((COUNT + 1))
            [[ "$COUNT" -gt 10 ]] && break

            SAFE_NAME="$(printf '%s' "$path" | tr '/ ' '__')"
            RAW="$(gh api "repos/$REPO/contents/$path?ref=$HEAD_SHA" 2>/dev/null || true)"
            [[ -z "$RAW" ]] && continue

            ENCODING="$(printf '%s' "$RAW" | jq -r '.encoding // empty')"
            [[ "$ENCODING" != "base64" ]] && continue

            CONTENT="$(printf '%s' "$RAW" | jq -r '.content // empty' | tr -d '\n' | base64 -d 2>/dev/null || true)"
            [[ -z "$CONTENT" ]] && continue

            LINE_COUNT="$(printf '%s' "$CONTENT" | wc -l | tr -d ' ')"
            if [[ "$LINE_COUNT" -le 1500 ]]; then
              printf '%s' "$CONTENT" > ".claude-review/context/$SAFE_NAME"
            fi
          done < .claude-review/sorted_files.txt

          echo "context_dir=.claude-review/context" >> "$GITHUB_OUTPUT"

      - name: Initialize review output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .claude-review
          : > .claude-review/output.md

      - name: Run Claude Code Review
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: >
            --dangerously-skip-permissions
            --max-turns 40
            --allowedTools
            "Bash"
          prompt: |
            You are running in GitHub Actions review automation.

            PR NUMBER: ${{ steps.mode.outputs.pr_number }}
            CURRENT HEAD SHA: ${{ steps.state.outputs.current_head_sha }}

            Prepared inputs:
            - Diff to review: ${{ steps.review_input.outputs.review_diff_path }}
            - Changed files list: ${{ steps.review_input.outputs.changed_files_path }}
            - Full post-change contents of changed files up to 1500 lines: ${{ steps.context.outputs.context_dir }}

            Scope:
            - Read only these files: ./.claude/CLAUDE.md, ./docs/documentation/contributing.md,
              ./docs/documentation/gpuParallelization.md, the prepared inputs above, and files inside the context directory.
            - Every finding must be grounded in a changed hunk. Unchanged lines in changed files are context only.
            - Do not comment on code outside the changed files, and do not give general repo suggestions or style nitpicks.

            Required steps, in order; do not skip any:
            1) cat .claude/CLAUDE.md
            2) Read the Common Pitfalls section of docs/documentation/contributing.md. If the diff touches GPU macros or
               src/simulation, also read docs/documentation/gpuParallelization.md.
            3) cat the changed files list and the diff.
            4) For each changed Fortran or Python file that has a context file, open it and check each changed hunk against
               its surroundings: declarations, loop bounds, callers and callees within the file, comments that state what
               the code does, and the matching code paths in other directions, targets or branches.
            5) Write .claude-review/output.md in the format below, then STOP. Do not post GitHub comments yourself.

            What to report: correctness bugs first (logic, numerics, array bounds, precision, memory, MPI, GPU macros,
            physics consistency, compiler portability), then code that contradicts its own comments or docs. Report a
            finding when the diff gives concrete evidence for it, and say how sure you are. Leave out only pure speculation.

            Output format (always write the file, even with no findings):

            Claude Code Review

            Head SHA: <sha>

            Files changed:
            - <count>
            - <up to 10 paths from changed_files.txt>

            Findings:
            - **<high|medium>** `<path>`: <issue, evidence from the hunk, and suggested fix>

            If there are no findings, replace the list with "No issues found." followed by one line naming the files you
            checked in step 4.

            <!-- claude-review: thread=primary; reviewed_sha=<current_head_sha>; mode=full -->

            Include the hidden marker exactly once, at the end of the file.

      - name: Upload review transcript
        if: always() && steps.claude.outputs.execution_file != ''
        uses: actions/upload-artifact@v6
        with:
          name: claude-review-transcript
          path: ${{ steps.claude.outputs.execution_file }}
          retention-days: 14

      - name: Publish review comment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          PR_NUMBER="${{ steps.mode.outputs.pr_number }}"
          REPO="${{ github.repository }}"
          COMMENT_ID="${{ steps.state.outputs.existing_comment_id }}"
          OUTPUT_FILE=".claude-review/output.md"

          # The prompt always asks for output, so an empty file means the review itself failed. Say so on the PR
          # instead of staying silent, which reads as a clean review.
          if [[ ! -s "$OUTPUT_FILE" ]] || [[ -z "$(tr -d '[:space:]' < "$OUTPUT_FILE")" ]]; then
            RUN_URL="${{ github.server_url }}/$REPO/actions/runs/${{ github.run_id }}"
            printf 'Claude Code Review\n\nHead SHA: %s\n\nThe review produced no output (Claude step: %s). Run and transcript: %s\n\n<!-- claude-review: thread=primary; reviewed_sha=%s; mode=full -->\n' \
              "${{ steps.state.outputs.current_head_sha }}" "${{ steps.claude.outcome }}" "$RUN_URL" "${{ steps.state.outputs.current_head_sha }}" > "$OUTPUT_FILE"
          fi

          BODY_JSON="$(jq -Rs '{body: .}' < "$OUTPUT_FILE")"

          if [[ -n "${COMMENT_ID:-}" ]]; then
            gh api \
              --method PATCH \
              "repos/$REPO/issues/comments/$COMMENT_ID" \
              --input - <<< "$BODY_JSON" >/dev/null
            echo "Updated existing primary review comment: $COMMENT_ID"
          else
            gh api \
              --method POST \
              "repos/$REPO/issues/$PR_NUMBER/comments" \
              --input - <<< "$BODY_JSON" >/dev/null
            echo "Created new primary review comment."
          fi

      - name: Fallback job summary on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .claude-review/output.md ]] && [[ -s .claude-review/output.md ]]; then
            {
              echo "## Claude Code Review"
              echo
              cat .claude-review/output.md
            } >> "$GITHUB_STEP_SUMMARY"
          fi
